      consumes:
      - application/json
      description: Update Suricata detection rules
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update Suricata rules
      tags:
      - suricata
  /services/wazuh/logs:
    get:
      consumes:
